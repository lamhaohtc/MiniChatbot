name: daily-sync

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kb-sync .
      - name: Run sync (scrape -> diff -> upload delta)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: |
          mkdir -p artifacts
          docker run --rm \
            -e OPENAI_API_KEY -e VECTOR_STORE_ID \
            -v "$PWD/artifacts:/app/artifacts" \
            kb-sync
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: artifacts/
